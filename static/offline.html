<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Internet aloqasi yo'q</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #FFFFFF;
            font-family: 'Manrope', 'Segoe UI', Arial, sans-serif;
            color: #0C2340;
            padding: 24px 16px;
        }

        .karta {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .logo {
            width: 64px;
            height: 64px;
            border-radius: 20px;
            background: #F0F8FF;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .logo svg {
            width: 32px;
            height: 32px;
            color: #185FA5;
        }

        h1 {
            font-size: 18px;
            font-weight: 700;
            color: #0C2340;
            margin: 0 0 6px;
        }

        p {
            font-size: 13px;
            color: #7C8B9E;
            margin: 0 0 24px;
        }

        .qayta-urinish {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 12px;
            background: #185FA5;
            color: #FFFFFF;
            font-family: 'Manrope', 'Segoe UI', Arial, sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .qayta-urinish:hover {
            background: #1B6BBA;
        }
    </style>
</head>
<body>
    <div class="karta">
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 3L21 21" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                <path d="M8.5 8.62C6.44 10.1 4 12.5 4 12.5S9 21 12 21C13.28 21 14.6 20.53 15.79 19.79M17.5 16.5C18.7 14.9 19 12.5 19 12.5S15.5 6.5 12 3C11.3 3.7 10.4 4.7 9.5 5.85" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <h1>Internet aloqasi yo'q</h1>
        <p>Ushbu sahifa oflayn holatda mavjud emas. Internetga ulanishni tekshirib, qayta urinib ko'ring.</p>

        <button class="qayta-urinish" onclick="window.location.reload()">Qayta urinish</button>
    </div>
</body>
</html>
