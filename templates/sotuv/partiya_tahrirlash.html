{% load l10n %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Partiyani tahrirlash</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #FFFFFF;
            font-family: 'Manrope', 'Segoe UI', Arial, sans-serif;
            color: #0C2340;
        }

        .sahifa {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        .sarlavha-panel {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .orqaga {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: #F0F8FF;
            color: #185FA5;
            text-decoration: none;
            flex-shrink: 0;
        }

        .orqaga svg {
            width: 18px;
            height: 18px;
        }

        h1 {
            font-size: 18px;
            font-weight: 700;
            color: #0C2340;
            margin: 0;
        }

        .xato {
            background: #FCEBEB;
            color: #A32D2D;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #0C2340;
            margin-bottom: 6px;
        }

        .maydon {
            margin-bottom: 14px;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            height: 44px;
            border: 1px solid #E4EDF6;
            border-radius: 10px;
            padding: 0 14px;
            font-family: 'Manrope', 'Segoe UI', Arial, sans-serif;
            font-size: 14px;
            color: #0C2340;
            background: #FFFFFF;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #185FA5;
            box-shadow: 0 0 0 3px rgba(24, 95, 165, 0.15);
        }

        .saqlash-tugma {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 12px;
            background: #185FA5;
            color: #FFFFFF;
            font-family: 'Manrope', 'Segoe UI', Arial, sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: box-shadow 0.2s ease, background-color 0.2s ease;
            margin-top: 8px;
        }

        .saqlash-tugma:hover {
            background: #1B6BBA;
            box-shadow: 0 0 0 4px rgba(24, 95, 165, 0.2);
        }

        #yangi_mahsulot_blok {
            display: none;
        }

        #yangi_mahsulot_blok.ochiq {
            display: block;
        }
    </style>
</head>
<body>
    <div class="sahifa">
        <div class="sarlavha-panel">
            <a href="{% url 'partiya_batafsil' partiya.pk %}" class="orqaga" aria-label="Orqaga">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 19L8 12L15 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>
            <h1>Partiyani tahrirlash</h1>
        </div>

        {% if xato %}
            <div class="xato">{{ xato }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="maydon">
                <label for="id_mahsulot_tanlov">Mahsulot turi</label>
                <select name="mahsulot_tanlov" id="id_mahsulot_tanlov">
                    {% for mahsulot in mahsulot_turlari %}
                        <option value="{{ mahsulot.pk }}"{% if mahsulot.pk == partiya.mahsulot_id %} selected{% endif %}>{{ mahsulot.nomi }}</option>
                    {% endfor %}
                    <option value="yangi">+ Yangi tur qo'shish</option>
                </select>
            </div>

            <div class="maydon" id="yangi_mahsulot_blok">
                <label for="id_yangi_mahsulot_nomi">Yangi tur nomi</label>
                <input type="text" name="yangi_mahsulot_nomi" id="id_yangi_mahsulot_nomi" placeholder="masalan: Prokladka">
            </div>

            <div class="maydon">
                <label for="id_fura">Fura (ixtiyoriy)</label>
                <select name="fura" id="id_fura">
                    <option value="">Tanlanmagan</option>
                    {% for fura in furalar %}
                        <option value="{{ fura.pk }}"{% if partiya.fura_id == fura.pk %} selected{% endif %}>{{ fura.sana|date:"d.m.Y" }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="maydon">
                <label for="id_kelgan_soni">Kelgan soni</label>
                <input type="number" min="1" name="kelgan_soni" id="id_kelgan_soni" value="{{ partiya.kelgan_soni }}" required>
            </div>

            <div class="maydon">
                <label for="id_umumiy_tannarx">Umumiy tannarx (butun partiya uchun)</label>
                <input type="number" step="0.01" min="0" name="umumiy_tannarx" id="id_umumiy_tannarx" value="{{ partiya.umumiy_tannarx|unlocalize|default:'' }}">
            </div>

            <div class="maydon">
                <label for="id_sana">Sana</label>
                <input type="date" name="sana" id="id_sana" value="{{ partiya.sana|date:'Y-m-d' }}" required>
            </div>

            <div class="maydon">
                <label for="id_izoh">Izoh (ixtiyoriy)</label>
                <textarea name="izoh" id="id_izoh" rows="2" style="height:auto;padding:10px 14px;resize:vertical;">{{ partiya.izoh }}</textarea>
            </div>

            <button type="submit" class="saqlash-tugma">Saqlash</button>
        </form>
    </div>

    <script>
        var mahsulotTanlov = document.getElementById('id_mahsulot_tanlov');
        var yangiBlok = document.getElementById('yangi_mahsulot_blok');

        function yangiBlokniYangilash() {
            if (mahsulotTanlov.value === 'yangi') {
                yangiBlok.classList.add('ochiq');
            } else {
                yangiBlok.classList.remove('ochiq');
            }
        }

        mahsulotTanlov.addEventListener('change', yangiBlokniYangilash);
        yangiBlokniYangilash();
    </script>
</body>
</html>
