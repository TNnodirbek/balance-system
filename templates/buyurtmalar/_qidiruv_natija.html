{% if qidiruv %}
<div class="qidiruv-natija-blok">
    <p class="qidiruv-natija-sarlavha">Qidiruv natijasi:</p>
    <div class="tanlov-chiplar">
        {% for hajm, son in hajm_jami.items %}
        <div class="tanlov-chip"><span class="tanlov-chip-hajm">{{ hajm }}</span><span class="tanlov-chip-son">{{ son }}</span></div>
        {% endfor %}
        <div class="tanlov-chip tanlov-chip-jami"><span class="tanlov-chip-hajm">Jami</span><span class="tanlov-chip-son">{{ jami_son }}</span></div>
    </div>
</div>
{% endif %}
