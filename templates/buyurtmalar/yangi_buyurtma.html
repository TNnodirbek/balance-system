{% load l10n %}
{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yangi buyurtma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #FFFFFF;
            font-family: 'Manrope', 'Segoe UI', Arial, sans-serif;
            color: #0C2340;
        }

        .sahifa {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        .sarlavha-panel {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .orqaga {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: #F0F8FF;
            color: #185FA5;
            text-decoration: none;
            flex-shrink: 0;
        }

        .orqaga svg {
            width: 18px;
            height: 18px;
        }

        h1 {
            font-size: 18px;
            font-weight: 700;
            color: #0C2340;
            margin: 0;
        }

        .xato {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            background: #FCEBEB;
            color: #A32D2D;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 18px;
        }

        .xato svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .bolim {
            margin-bottom: 22px;
        }

        .bolim-sarlavha {
            font-size: 15px;
            font-weight: 700;
            color: #0C2340;
            margin: 0 0 12px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #0C2340;
            margin-bottom: 6px;
        }

        .maydon {
            margin-bottom: 12px;
        }

        .input-qobiq {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-qobiq svg.chap-ikonka {
            position: absolute;
            left: 14px;
            width: 16px;
            height: 16px;
            color: #94A7BD;
            pointer-events: none;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            height: 44px;
            border: 1px solid #E4EDF6;
            border-radius: 10px;
            padding: 0 14px;
            font-family: 'Manrope', 'Segoe UI', Arial, sans-serif;
            font-size: 14px;
            color: #0C2340;
            background: #FFFFFF;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input-qobiq input {
            padding-left: 38px;
        }

        .telefon-input {
            height: 48px;
            font-size: 16px;
            font-weight: 600;
        }

        input:focus,
        textarea:focus {
            border-color: #185FA5;
            box-shadow: 0 0 0 3px rgba(24, 95, 165, 0.15);
        }

        textarea {
            height: auto;
            min-height: 76px;
            padding: 10px 14px;
            resize: vertical;
        }

        /* Do'kon qidiruv natijalari */
        .qidirish-qobiq {
            position: relative;
        }

        #qidirish_natijalari {
            list-style: none;
            margin: 6px 0 0;
            padding: 0;
            position: absolute;
            z-index: 5;
            width: 100%;
            background: #FFFFFF;
            border: 1px solid #E4EDF6;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(12, 35, 64, 0.08);
            overflow: hidden;
        }

        #qidirish_natijalari:empty {
            display: none;
            border: none;
            box-shadow: none;
        }

        #qidirish_natijalari li {
            padding: 10px 14px;
            font-size: 13px;
            color: #0C2340;
            border-bottom: 1px solid #F0F3F7;
            cursor: pointer;
        }

        #qidirish_natijalari li:last-child {
            border-bottom: none;
        }

        #qidirish_natijalari li:hover {
            background: #F0F8FF;
        }

        /* Mahsulot kartalari */
        .mahsulot-karta {
            background: #FFFFFF;
            border: 1px solid #E4EDF6;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            padding: 16px;
            margin-bottom: 12px;
        }

        .mahsulot-qatori-tepa {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .mahsulot-nomi {
            font-size: 15px;
            font-weight: 700;
            color: #0C2340;
        }

        .narx-maydoni {
            width: 110px;
            flex-shrink: 0;
        }

        .narx-maydoni label {
            text-align: right;
        }

        .narx-maydoni input {
            text-align: right;
            height: 38px;
        }

        .stepper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }

        .stepper-tugma {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1.5px solid #185FA5;
            background: #FFFFFF;
            color: #185FA5;
            font-size: 18px;
            font-weight: 700;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
            flex-shrink: 0;
        }

        .stepper-tugma:hover {
            background: #F0F8FF;
            box-shadow: 0 0 0 3px rgba(24, 95, 165, 0.15);
        }

        .stepper-input {
            width: 72px;
            height: 40px;
            text-align: center;
            font-size: 16px;
            font-weight: 700;
        }

        .mahsulot-karta.omborda-yoq {
            background: #FCEBEB;
            border-color: #F0C4C4;
        }

        .stepper-input.omborda-xato {
            border-color: #A32D2D;
            box-shadow: 0 0 0 3px rgba(163, 45, 45, 0.15);
        }

        .omborda-xabar {
            font-size: 11px;
            font-weight: 600;
            color: #A32D2D;
            text-align: center;
            margin: 10px 0 0;
        }

        .omborda-xabar:empty {
            display: none;
            margin: 0;
        }

        .jami-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #F0F8FF;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 22px;
        }

        .jami-label {
            font-size: 13px;
            font-weight: 600;
            color: #0C2340;
        }

        .jami-son {
            font-size: 18px;
            font-weight: 700;
            color: #185FA5;
        }

        .yaratish-tugma {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 12px;
            background: #185FA5;
            color: #FFFFFF;
            font-family: 'Manrope', 'Segoe UI', Arial, sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: box-shadow 0.2s ease, background-color 0.2s ease;
        }

        .yaratish-tugma:hover {
            background: #1B6BBA;
            box-shadow: 0 0 0 4px rgba(24, 95, 165, 0.2);
        }

        .joylashuv-tugma {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 44px;
            border: 1px solid #B5D4F4;
            border-radius: 10px;
            background: #F0F8FF;
            color: #185FA5;
            font-family: 'Manrope', 'Segoe UI', Arial, sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .joylashuv-tugma svg {
            width: 18px;
            height: 18px;
        }

        .joylashuv-tugma.aniqlandi {
            background: #E8F5E9;
            border-color: #C3E6C5;
            color: #2E7D32;
        }

        .joylashuv-xato {
            font-size: 12px;
            color: #7C8B9E;
            margin: 8px 0 0;
            text-align: center;
        }

        .joylashuv-xato:empty {
            display: none;
            margin: 0;
        }

        /* Joylashuv tanlash xarita qatlami */
        .joylashuv-xarita-qatlam {
            position: fixed;
            inset: 0;
            background: #FFFFFF;
            z-index: 1000;
            display: none;
            flex-direction: column;
        }

        .joylashuv-xarita-qatlam.ochiq {
            display: flex;
        }

        .jx-panel {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            border-bottom: 1px solid #E4EDF6;
            flex-shrink: 0;
        }

        .jx-orqaga {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: #F0F8FF;
            color: #185FA5;
            border: none;
            cursor: pointer;
            flex-shrink: 0;
        }

        .jx-orqaga svg {
            width: 18px;
            height: 18px;
        }

        .jx-panel h2 {
            font-size: 15px;
            font-weight: 700;
            color: #0C2340;
            margin: 0;
        }

        .jx-korpus {
            flex: 1;
            position: relative;
            min-height: 0;
        }

        #joylashuv-leaflet-map {
            width: 100%;
            height: 100%;
        }

        .jx-mening-joylashuvim {
            position: absolute;
            right: 16px;
            bottom: 16px;
            z-index: 500;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            background: #185FA5;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(24, 95, 165, 0.35);
        }

        .jx-mening-joylashuvim svg {
            width: 24px;
            height: 24px;
        }

        .jx-pastki-panel {
            flex-shrink: 0;
            padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
            border-top: 1px solid #E4EDF6;
        }

        .jx-xato {
            font-size: 12px;
            color: #A32D2D;
            text-align: center;
            margin: 0 0 8px;
        }

        .jx-xato:empty {
            display: none;
            margin: 0;
        }

        .jx-tasdiqlash-tugma {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 12px;
            background: #185FA5;
            color: #FFFFFF;
            font-family: 'Manrope', 'Segoe UI', Arial, sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="sahifa">
        <div class="sarlavha-panel">
            <a href="javascript:history.back()" class="orqaga" aria-label="Orqaga">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 19L8 12L15 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>
            <h1>Yangi buyurtma</h1>
        </div>

        {% if xato %}
            <div class="xato">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 9V13M12 17H12.01M10.29 3.86L1.82 18A2 2 0 0 0 3.55 21H20.45A2 2 0 0 0 22.18 18L13.71 3.86A2 2 0 0 0 10.29 3.86Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>{{ xato }}</span>
            </div>
        {% endif %}

        <form method="post" autocomplete="off">
            {% csrf_token %}
            <input type="hidden" name="dokon_id" id="dokon_id">
            <input type="hidden" name="joylashuv_lat" id="joylashuv_lat">
            <input type="hidden" name="joylashuv_lng" id="joylashuv_lng">

            <div class="bolim">
                <p class="bolim-sarlavha">Do'kon</p>

                <div class="maydon qidirish-qobiq">
                    <label for="dokon_qidirish">Qidirish</label>
                    <div class="input-qobiq">
                        <svg class="chap-ikonka" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.7"/>
                            <path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                        </svg>
                        <input type="text" id="dokon_qidirish" placeholder="Do'kon nomi yoki telefon">
                    </div>
                    <ul id="qidirish_natijalari"></ul>
                </div>

                <div class="maydon">
                    <label for="dokon_nomi">Nomi</label>
                    <input type="text" name="dokon_nomi" id="dokon_nomi" required>
                </div>
                <div class="maydon">
                    <label for="dokon_manzil">Manzil</label>
                    <input type="text" name="dokon_manzil" id="dokon_manzil" required>
                </div>
                <div class="maydon">
                    <label for="dokon_telefon">Telefon</label>
                    <input type="tel" inputmode="numeric" name="dokon_telefon" id="dokon_telefon" class="telefon-input" placeholder="99-755-78-89" required>
                </div>
            </div>

            <div class="bolim">
                <p class="bolim-sarlavha">Mahsulotlar</p>

                {% for item in mahsulot_qatorlari %}
                <div class="mahsulot-karta" data-qoldiq="{{ item.qoldiq|default:0 }}">
                    <div class="mahsulot-qatori-tepa">
                        <span class="mahsulot-nomi">{{ item.hajm }} suv</span>
                        <div class="narx-maydoni">
                            <label for="narx_{{ forloop.counter0 }}">Narx</label>
                            <input type="number" step="0.01" min="0" name="narx[]" id="narx_{{ forloop.counter0 }}" value="{{ item.narx_standart|unlocalize }}" class="mahsulot-narx-input nol-tozalanadigan">
                        </div>
                    </div>
                    <input type="hidden" name="hajm[]" value="{{ item.hajm }}">
                    <div class="stepper">
                        <button type="button" class="stepper-tugma" data-target="soni_{{ forloop.counter0 }}" data-delta="-1">&minus;</button>
                        <input type="number" min="0" name="soni[]" id="soni_{{ forloop.counter0 }}" value="0" class="stepper-input mahsulot-soni-input nol-tozalanadigan" data-qoldiq="{{ item.qoldiq|default:0 }}">
                        <button type="button" class="stepper-tugma" data-target="soni_{{ forloop.counter0 }}" data-delta="1">+</button>
                    </div>
                    <p class="omborda-xabar"></p>
                </div>
                {% endfor %}

                <div class="jami-panel">
                    <span class="jami-label">Jami</span>
                    <span class="jami-son"><span id="umumiy_summa">0 so'm</span></span>
                </div>
            </div>

            <div class="bolim">
                <div class="maydon">
                    <label for="izoh">Izoh (ixtiyoriy)</label>
                    <textarea name="izoh" id="izoh" placeholder="Qo'shimcha izoh..."></textarea>
                </div>
            </div>

            <div class="bolim">
                <button type="button" class="joylashuv-tugma" id="joylashuv-tugma">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2C12 2 5 10.5 5 15.5C5 19.6421 8.13401 22 12 22C15.866 22 19 19.6421 19 15.5C19 10.5 12 2 12 2Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                        <circle cx="12" cy="14" r="2.3" stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                    <span id="joylashuv-matn">Joylashuvni aniqlash</span>
                </button>
            </div>

            <button type="submit" class="yaratish-tugma">Buyurtma yaratish</button>
        </form>
    </div>

    <div class="joylashuv-xarita-qatlam" id="joylashuv-xarita-qatlam">
        <div class="jx-panel">
            <button type="button" class="jx-orqaga" id="jx-orqaga" aria-label="Orqaga">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <h2>Joylashuvni tanlang</h2>
        </div>
        <div class="jx-korpus">
            <div id="joylashuv-leaflet-map"></div>
            <button type="button" class="jx-mening-joylashuvim" id="jx-mening-joylashuvim" aria-label="Mening joylashuvim">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2V5M12 19V22M2 12H5M19 12H22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/>
                </svg>
            </button>
        </div>
        <div class="jx-pastki-panel">
            <p class="jx-xato" id="jx-xato"></p>
            <button type="button" class="jx-tasdiqlash-tugma" id="jx-tasdiqlash">Tasdiqlash</button>
        </div>
    </div>

    <script>
        function guruhlaSon(son) {
            var matn = String(son);
            var natija = '';
            var sanoq = 0;
            for (var i = matn.length - 1; i >= 0; i--) {
                natija = matn[i] + natija;
                sanoq++;
                if (sanoq % 3 === 0 && i !== 0) {
                    natija = '.' + natija;
                }
            }
            return natija;
        }

        function formatSom(son) {
            son = Math.round(son);
            var manfiy = son < 0;
            son = Math.abs(son);
            var natija;
            if (son >= 1000000) {
                var mln = Math.floor(son / 1000000);
                var ming = Math.floor((son % 1000000) / 1000);
                natija = ming ? (mln + " mln " + ming + " ming so'm") : (mln + " mln so'm");
            } else if (son >= 1000) {
                natija = guruhlaSon(son) + " so'm";
            } else {
                natija = son + " so'm";
            }
            return manfiy ? ('-' + natija) : natija;
        }

        function hisoblaSumma() {
            var narxInputlar = document.querySelectorAll('.mahsulot-narx-input');
            var soniInputlar = document.querySelectorAll('.mahsulot-soni-input');
            var summa = 0;
            for (var i = 0; i < narxInputlar.length; i++) {
                var narx = parseFloat(narxInputlar[i].value) || 0;
                var soni = parseFloat(soniInputlar[i].value) || 0;
                summa += narx * soni;
            }
            document.getElementById('umumiy_summa').textContent = formatSom(summa);
        }
        function ombordaTekshir() {
            document.querySelectorAll('.mahsulot-karta').forEach(function (karta) {
                var qoldiq = parseInt(karta.dataset.qoldiq, 10) || 0;
                var soniInput = karta.querySelector('.mahsulot-soni-input');
                var xabarEl = karta.querySelector('.omborda-xabar');
                var soni = parseInt(soniInput.value, 10) || 0;

                if (qoldiq <= 0) {
                    karta.classList.add('omborda-yoq');
                    soniInput.classList.toggle('omborda-xato', soni > 0);
                    xabarEl.textContent = 'Omborda qolmagan';
                } else if (soni > qoldiq) {
                    karta.classList.remove('omborda-yoq');
                    soniInput.classList.add('omborda-xato');
                    xabarEl.textContent = 'Omborda faqat ' + qoldiq + ' ta bor';
                } else {
                    karta.classList.remove('omborda-yoq');
                    soniInput.classList.remove('omborda-xato');
                    xabarEl.textContent = '';
                }
            });
        }

        document.querySelectorAll('.mahsulot-narx-input, .mahsulot-soni-input').forEach(function (input) {
            input.addEventListener('input', function () {
                hisoblaSumma();
                ombordaTekshir();
            });
        });
        hisoblaSumma();
        ombordaTekshir();

        document.querySelectorAll('.stepper-tugma').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var input = document.getElementById(btn.dataset.target);
                var delta = parseInt(btn.dataset.delta, 10);
                var qiymat = parseInt(input.value, 10) || 0;
                qiymat = Math.max(0, qiymat + delta);
                input.value = qiymat;
                hisoblaSumma();
                ombordaTekshir();
            });
        });

        var qidirishInput = document.getElementById('dokon_qidirish');
        var natijalarEl = document.getElementById('qidirish_natijalari');

        qidirishInput.addEventListener('input', function () {
            document.getElementById('dokon_id').value = '';
            var q = qidirishInput.value;
            if (q.length < 2) {
                natijalarEl.innerHTML = '';
                return;
            }
            fetch('/buyurtmalar/dokon-qidirish/?q=' + encodeURIComponent(q))
                .then(function (resp) { return resp.json(); })
                .then(function (data) {
                    natijalarEl.innerHTML = '';
                    data.natijalar.forEach(function (d) {
                        var li = document.createElement('li');
                        li.textContent = d.nomi + ' - ' + d.manzil + ' - ' + d.telefon;
                        li.addEventListener('click', function () {
                            document.getElementById('dokon_id').value = d.id;
                            document.getElementById('dokon_nomi').value = d.nomi;
                            document.getElementById('dokon_manzil').value = d.manzil;
                            document.getElementById('dokon_telefon').value = d.telefon;
                            natijalarEl.innerHTML = '';
                            qidirishInput.value = d.nomi;
                        });
                        natijalarEl.appendChild(li);
                    });
                });
        });

        var joylashuvTugma = document.getElementById('joylashuv-tugma');
        var joylashuvMatn = document.getElementById('joylashuv-matn');

        /* Joylashuv tanlash xarita qatlami (Leaflet + OpenStreetMap) */
        var jxQatlam = document.getElementById('joylashuv-xarita-qatlam');
        var jxXato = document.getElementById('jx-xato');
        var jxXaritaObj = null;
        var jxMarker = null;

        var kokNuqtaIkonka = L.divIcon({
            className: '',
            html: '<div style="width:18px;height:18px;border-radius:50%;background:#185FA5;border:3px solid #fff;box-shadow:0 0 0 2px #185FA5;"></div>',
            iconSize: [18, 18],
            iconAnchor: [9, 9],
        });

        function jxMarkerJoylash(lat, lng) {
            var latlng = L.latLng(lat, lng);
            if (jxMarker) {
                jxMarker.setLatLng(latlng);
            } else {
                jxMarker = L.marker(latlng, { icon: kokNuqtaIkonka, draggable: true }).addTo(jxXaritaObj);
            }
        }

        function joylashuvXaritaOch() {
            jxQatlam.classList.add('ochiq');
            jxXato.textContent = '';

            if (!jxXaritaObj) {
                var mavjudLat = document.getElementById('joylashuv_lat').value;
                var mavjudLng = document.getElementById('joylashuv_lng').value;
                var markaz = (mavjudLat && mavjudLng) ? [parseFloat(mavjudLat), parseFloat(mavjudLng)] : [40.3894, 71.7864];
                var boshlangichZoom = (mavjudLat && mavjudLng) ? 16 : 11;

                jxXaritaObj = L.map('joylashuv-leaflet-map').setView(markaz, boshlangichZoom);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '&copy; OpenStreetMap',
                }).addTo(jxXaritaObj);

                jxMarkerJoylash(markaz[0], markaz[1]);

                jxXaritaObj.on('click', function (e) {
                    jxMarkerJoylash(e.latlng.lat, e.latlng.lng);
                });
            } else {
                setTimeout(function () { jxXaritaObj.invalidateSize(); }, 0);
            }
        }

        function joylashuvXaritaYop() {
            jxQatlam.classList.remove('ochiq');
        }

        joylashuvTugma.addEventListener('click', joylashuvXaritaOch);
        document.getElementById('jx-orqaga').addEventListener('click', joylashuvXaritaYop);

        function jxStandaloneRejimdami() {
            return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        }

        function jxGeolocationXatoMatni(error) {
            // error.code: 1=PERMISSION_DENIED, 2=POSITION_UNAVAILABLE, 3=TIMEOUT
            if (error.code === error.PERMISSION_DENIED) {
                if (jxStandaloneRejimdami()) {
                    return "Joylashuvga ruxsat berilmagan. iPhone'da: Sozlamalar → Maxfiylik va xavfsizlik → Joylashuv xizmatlari → Safari → \"Ilova ishlatilganda\" ni tanlang, so'ngra ilovani yopib qayta oching.";
                }
                return "Joylashuvga ruxsat berilmagan. Brauzeringiz sozlamalaridan bu sayt uchun joylashuv ruxsatini yoqing.";
            }
            if (error.code === error.POSITION_UNAVAILABLE) {
                return "Joylashuvni aniqlab bo'lmadi (GPS signali topilmadi). Ochiq joyda qayta urinib ko'ring yoki xaritadan qo'lda belgilang.";
            }
            if (error.code === error.TIMEOUT) {
                return "Joylashuvni aniqlash vaqti tugadi. Qayta urinib ko'ring yoki xaritadan qo'lda belgilang.";
            }
            return "Joylashuvni avtomatik aniqlab bo'lmadi, xaritadan qo'lda belgilang.";
        }

        document.getElementById('jx-mening-joylashuvim').addEventListener('click', function () {
            jxXato.textContent = '';

            if (!navigator.geolocation) {
                jxXato.textContent = "Bu qurilma/brauzer joylashuvni aniqlashni qo'llab-quvvatlamaydi, xaritadan qo'lda belgilang.";
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function (position) {
                    var lat = position.coords.latitude;
                    var lng = position.coords.longitude;
                    jxMarkerJoylash(lat, lng);
                    jxXaritaObj.setView([lat, lng], 16);
                },
                function (error) {
                    // Xato turini konsolga chiqaramiz - aniq sababni (ruxsat
                    // rad etilganmi, GPS topilmadimi, timeout bo'ldimi)
                    // kelajakda ham tekshirish uchun foydali, foydalanuvchiga
                    // ko'rinmaydi.
                    console.warn('Geolocation xatosi: code=' + error.code + ' message=' + error.message);
                    jxXato.textContent = jxGeolocationXatoMatni(error);
                },
                { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
            );
        });

        document.getElementById('jx-tasdiqlash').addEventListener('click', function () {
            if (jxMarker) {
                var latlng = jxMarker.getLatLng();
                document.getElementById('joylashuv_lat').value = latlng.lat;
                document.getElementById('joylashuv_lng').value = latlng.lng;
                joylashuvMatn.textContent = 'Joylashuv aniqlandi ✓';
                joylashuvTugma.classList.add('aniqlandi');
            }
            joylashuvXaritaYop();
        });
    </script>
    <script src="{% static 'js/telefon-format.js' %}"></script>
    <script src="{% static 'js/forma-himoya.js' %}"></script>
    <script src="{% static 'js/nol-tozalash.js' %}"></script>
</body>
</html>
