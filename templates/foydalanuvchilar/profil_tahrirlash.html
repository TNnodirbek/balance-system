{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profil</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Manrope', 'Segoe UI', Arial, sans-serif;
            background: #FFFFFF;
            color: #0C2340;
        }
        .qobiq { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
        .sarlavha-panel {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .orqaga {
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 10px;
            background: #F0F8FF;
            color: #185FA5;
            text-decoration: none;
            flex-shrink: 0;
        }
        .sarlavha-panel h1 {
            font-size: 18px;
            font-weight: 700;
            color: #0C2340;
            margin: 0;
        }
        .xabar-quti {
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .xabar-muvaffaqiyat { background: #E8F5E9; color: #2E7D32; }
        .xabar-xato { background: #FCEBEB; color: #A32D2D; }
        .maydon { margin-bottom: 16px; }
        .maydon label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #0C2340;
            margin-bottom: 6px;
        }
        .maydon input {
            width: 100%;
            height: 44px;
            border: 1px solid #E4EDF6;
            border-radius: 10px;
            padding: 0 14px;
            font-family: 'Manrope', 'Segoe UI', Arial, sans-serif;
            font-size: 14px;
            color: #0C2340;
            outline: none;
        }
        .maydon input:focus {
            border-color: #185FA5;
            background: #F7FAFD;
        }
        .parol-qobiq { position: relative; }
        .parol-qobiq input { padding-right: 44px; }
        .koz-tugma {
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            color: #7C8B9E;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
        }
        .koz-tugma svg { width: 18px; height: 18px; }
        .bolim-sarlavha {
            font-size: 12px;
            font-weight: 600;
            color: #7C8B9E;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin: 22px 0 12px 0;
        }
        .saqlash-tugma {
            width: 100%;
            height: 52px;
            background: #185FA5;
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            font-family: 'Manrope', 'Segoe UI', Arial, sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        .saqlash-tugma:hover {
            box-shadow: 0 4px 14px rgba(24, 95, 165, 0.28);
        }
    </style>
</head>
<body>
    <div class="qobiq">
        <div class="sarlavha-panel">
            <a href="javascript:history.back()" class="orqaga" aria-label="Orqaga">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
            <h1>Profil</h1>
        </div>

        {% if xabar %}
        <div class="xabar-quti xabar-muvaffaqiyat">{{ xabar }}</div>
        {% endif %}
        {% if xato %}
        <div class="xabar-quti xabar-xato">{{ xato }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="maydon">
                <label>Ism</label>
                <input type="text" name="ism" value="{{ user.first_name }}">
            </div>
            <div class="maydon">
                <label>Telefon</label>
                <input type="tel" inputmode="numeric" name="telefon" value="{{ user.telefon }}" class="telefon-input" placeholder="99-755-78-89">
            </div>

            <p class="bolim-sarlavha">Parolni o'zgartirish (ixtiyoriy)</p>

            <div class="maydon">
                <label>Eski parol</label>
                <div class="parol-qobiq">
                    <input type="password" name="eski_parol" id="eski-parol">
                    <button type="button" class="koz-tugma" onclick="parolniAlmashtir('eski-parol', this)" aria-label="Ko'rsatish">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M1 12S5 4 12 4S23 12 23 12S19 20 12 20S1 12 1 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>
            <div class="maydon">
                <label>Yangi parol</label>
                <div class="parol-qobiq">
                    <input type="password" name="yangi_parol" id="yangi-parol">
                    <button type="button" class="koz-tugma" onclick="parolniAlmashtir('yangi-parol', this)" aria-label="Ko'rsatish">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M1 12S5 4 12 4S23 12 23 12S19 20 12 20S1 12 1 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>
            <div class="maydon">
                <label>Yangi parol (tasdiq)</label>
                <div class="parol-qobiq">
                    <input type="password" name="yangi_parol_tasdiq" id="yangi-parol-tasdiq">
                    <button type="button" class="koz-tugma" onclick="parolniAlmashtir('yangi-parol-tasdiq', this)" aria-label="Ko'rsatish">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M1 12S5 4 12 4S23 12 23 12S19 20 12 20S1 12 1 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="saqlash-tugma">Saqlash</button>
        </form>
    </div>

    <script>
        function parolniAlmashtir(inputId, tugma) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                tugma.style.color = '#185FA5';
            } else {
                input.type = 'password';
                tugma.style.color = '#7C8B9E';
            }
        }
    </script>
    <script src="{% static 'js/telefon-format.js' %}"></script>
    <script src="{% static 'js/forma-himoya.js' %}"></script>
</body>
</html>
