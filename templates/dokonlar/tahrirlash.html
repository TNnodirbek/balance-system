<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Do'konni tahrirlash</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Manrope', 'Segoe UI', Arial, sans-serif;
            background: #FFFFFF;
            color: #0C2340;
        }
        .qobiq { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
        .sarlavha-panel {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .orqaga {
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 10px;
            background: #F0F8FF;
            color: #185FA5;
            text-decoration: none;
            flex-shrink: 0;
        }
        .sarlavha-panel h1 {
            font-size: 18px;
            font-weight: 700;
            color: #0C2340;
            margin: 0;
        }
        .xabar-quti {
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 16px;
            background: #E8F5E9;
            color: #2E7D32;
        }
        .maydon { margin-bottom: 16px; }
        .maydon label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #0C2340;
            margin-bottom: 6px;
        }
        .maydon input {
            width: 100%;
            height: 44px;
            border: 1px solid #E4EDF6;
            border-radius: 10px;
            padding: 0 14px;
            font-family: 'Manrope', 'Segoe UI', Arial, sans-serif;
            font-size: 14px;
            color: #0C2340;
            outline: none;
        }
        .maydon input:focus {
            border-color: #185FA5;
            background: #F7FAFD;
        }
        .saqlash-tugma {
            width: 100%;
            height: 52px;
            background: #185FA5;
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            font-family: 'Manrope', 'Segoe UI', Arial, sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        .saqlash-tugma:hover {
            box-shadow: 0 4px 14px rgba(24, 95, 165, 0.28);
        }
    </style>
</head>
<body>
    <div class="qobiq">
        <div class="sarlavha-panel">
            <a href="{% url 'dokonlar_royxati' %}" class="orqaga" aria-label="Orqaga">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
            <h1>Do'konni tahrirlash</h1>
        </div>

        {% if xabar %}
        <div class="xabar-quti">{{ xabar }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="maydon">
                <label>Nomi</label>
                <input type="text" name="nomi" value="{{ dokon.nomi }}" required>
            </div>
            <div class="maydon">
                <label>Manzili</label>
                <input type="text" name="manzili" value="{{ dokon.manzili }}">
            </div>
            <div class="maydon">
                <label>Telefon</label>
                <input type="text" name="telefon" value="{{ dokon.telefon }}">
            </div>
            <button type="submit" class="saqlash-tugma">Saqlash</button>
        </form>
    </div>
</body>
</html>
