{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Do'konni tahrirlash</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Manrope', 'Segoe UI', Arial, sans-serif;
            background: #FFFFFF;
            color: #0C2340;
        }
        .qobiq { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
        .sarlavha-panel {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .orqaga {
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 10px;
            background: #F0F8FF;
            color: #185FA5;
            text-decoration: none;
            flex-shrink: 0;
        }
        .sarlavha-panel h1 {
            font-size: 18px;
            font-weight: 700;
            color: #0C2340;
            margin: 0;
        }
        .xabar-quti {
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 16px;
            background: #E8F5E9;
            color: #2E7D32;
        }
        .maydon { margin-bottom: 16px; }
        .maydon label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #0C2340;
            margin-bottom: 6px;
        }
        .maydon input {
            width: 100%;
            height: 44px;
            border: 1px solid #E4EDF6;
            border-radius: 10px;
            padding: 0 14px;
            font-family: 'Manrope', 'Segoe UI', Arial, sans-serif;
            font-size: 14px;
            color: #0C2340;
            outline: none;
        }
        .maydon input:focus {
            border-color: #185FA5;
            background: #F7FAFD;
        }
        .maydon .telefon-input {
            height: 48px;
            font-size: 16px;
            font-weight: 600;
        }
        .saqlash-tugma {
            width: 100%;
            height: 52px;
            background: #185FA5;
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            font-family: 'Manrope', 'Segoe UI', Arial, sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        .saqlash-tugma:hover {
            box-shadow: 0 4px 14px rgba(24, 95, 165, 0.28);
        }
        .joylashuv-tugma {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 44px;
            border: 1px solid #B5D4F4;
            border-radius: 10px;
            background: #F0F8FF;
            color: #185FA5;
            font-family: 'Manrope', 'Segoe UI', Arial, sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .joylashuv-tugma.aniqlandi {
            background: #E8F5E9;
            border-color: #C3E6C5;
            color: #2E7D32;
        }
        .joylashuv-xato {
            font-size: 12px;
            color: #7C8B9E;
            margin: 8px 0 0;
            text-align: center;
        }
        .joylashuv-xato:empty {
            display: none;
            margin: 0;
        }
        .xarita-qobiq {
            margin-top: 16px;
        }
        .xarita-qobiq iframe {
            display: block;
        }
        .yol-boshlash-tugma {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 44px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: #185FA5;
            color: #FFFFFF;
            font-family: 'Manrope', 'Segoe UI', Arial, sans-serif;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="qobiq">
        <div class="sarlavha-panel">
            <a href="javascript:history.back()" class="orqaga" aria-label="Orqaga">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
            <h1>Do'konni tahrirlash</h1>
        </div>

        {% if xabar %}
        <div class="xabar-quti">{{ xabar }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="joylashuv_lat" id="joylashuv_lat" value="{{ dokon.joylashuv_lat|default:'' }}">
            <input type="hidden" name="joylashuv_lng" id="joylashuv_lng" value="{{ dokon.joylashuv_lng|default:'' }}">
            <div class="maydon">
                <label>Nomi</label>
                <input type="text" name="nomi" value="{{ dokon.nomi }}" required>
            </div>
            <div class="maydon">
                <label>Manzili</label>
                <input type="text" name="manzili" value="{{ dokon.manzili }}">
            </div>
            <div class="maydon">
                <label>Telefon</label>
                <input type="tel" inputmode="numeric" name="telefon" value="{{ dokon.telefon }}" class="telefon-input" placeholder="99-755-78-89">
            </div>

            <div class="maydon">
                <button type="button" class="joylashuv-tugma{% if dokon.joylashuv_lat %} aniqlandi{% endif %}" id="joylashuv-tugma">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2C12 2 5 10.5 5 15.5C5 19.6421 8.13401 22 12 22C15.866 22 19 19.6421 19 15.5C19 10.5 12 2 12 2Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                        <circle cx="12" cy="14" r="2.3" stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                    <span id="joylashuv-matn">{% if dokon.joylashuv_lat %}Joylashuv aniqlandi ✓{% else %}Joylashuvni aniqlash{% endif %}</span>
                </button>
                <p class="joylashuv-xato" id="joylashuv-xato"></p>
            </div>

            {% if dokon.joylashuv_lat and dokon.joylashuv_lng %}
            <div class="xarita-qobiq">
                <iframe src="https://maps.google.com/maps?q={{ dokon.joylashuv_lat }},{{ dokon.joylashuv_lng }}&z=15&output=embed" width="100%" height="220" style="border:0;border-radius:14px;" loading="lazy"></iframe>
                <a href="https://www.google.com/maps/dir/?api=1&destination={{ dokon.joylashuv_lat }},{{ dokon.joylashuv_lng }}" target="_blank" rel="noopener" class="yol-boshlash-tugma">Google Maps orqali yo'l boshlash</a>
            </div>
            {% endif %}

            <button type="submit" class="saqlash-tugma">Saqlash</button>
        </form>
    </div>

    <script>
        var joylashuvTugma = document.getElementById('joylashuv-tugma');
        var joylashuvMatn = document.getElementById('joylashuv-matn');
        var joylashuvXato = document.getElementById('joylashuv-xato');

        function joylashuvStandaloneRejimdami() {
            return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        }

        function joylashuvGeolocationXatoMatni(error) {
            // error.code: 1=PERMISSION_DENIED, 2=POSITION_UNAVAILABLE, 3=TIMEOUT
            if (error.code === error.PERMISSION_DENIED) {
                if (joylashuvStandaloneRejimdami()) {
                    return "Joylashuvga ruxsat berilmagan. iPhone'da: Sozlamalar → Maxfiylik va xavfsizlik → Joylashuv xizmatlari → Safari → \"Ilova ishlatilganda\" ni tanlang, so'ngra ilovani yopib qayta oching.";
                }
                return "Joylashuvga ruxsat berilmagan. Brauzeringiz sozlamalaridan bu sayt uchun joylashuv ruxsatini yoqing.";
            }
            if (error.code === error.POSITION_UNAVAILABLE) {
                return "Joylashuvni aniqlab bo'lmadi (GPS signali topilmadi). Ochiq joyda qayta urinib ko'ring.";
            }
            if (error.code === error.TIMEOUT) {
                return "Joylashuvni aniqlash vaqti tugadi. Qayta urinib ko'ring.";
            }
            return "Joylashuvni aniqlab bo'lmadi.";
        }

        joylashuvTugma.addEventListener('click', function () {
            joylashuvXato.textContent = '';

            if (!navigator.geolocation) {
                joylashuvXato.textContent = "Bu qurilma/brauzer joylashuvni aniqlashni qo'llab-quvvatlamaydi.";
                return;
            }

            navigator.geolocation.getCurrentPosition(
                function (position) {
                    document.getElementById('joylashuv_lat').value = position.coords.latitude;
                    document.getElementById('joylashuv_lng').value = position.coords.longitude;
                    joylashuvMatn.textContent = 'Joylashuv aniqlandi ✓';
                    joylashuvTugma.classList.add('aniqlandi');
                    joylashuvXato.textContent = '';
                },
                function (error) {
                    console.warn('Geolocation xatosi: code=' + error.code + ' message=' + error.message);
                    joylashuvXato.textContent = joylashuvGeolocationXatoMatni(error);
                },
                { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
            );
        });
    </script>
    <script src="{% static 'js/telefon-format.js' %}"></script>
    <script src="{% static 'js/forma-himoya.js' %}"></script>
</body>
</html>
