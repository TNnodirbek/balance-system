<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Do'konlar</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Manrope', 'Segoe UI', Arial, sans-serif;
            background: #FFFFFF;
            color: #0C2340;
        }
        .qobiq { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
        .sarlavha-panel {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .orqaga {
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 10px;
            background: #F0F8FF;
            color: #185FA5;
            text-decoration: none;
            flex-shrink: 0;
        }
        .sarlavha-panel h1 {
            font-size: 18px;
            font-weight: 700;
            color: #0C2340;
            margin: 0;
        }
        .dokon-karta {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #FFFFFF;
            border: 1px solid #E4EDF6;
            border-radius: 16px;
            padding: 14px 16px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .ikonka {
            width: 40px; height: 40px;
            border-radius: 10px;
            background: #F0F8FF;
            color: #185FA5;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .info { flex: 1; min-width: 0; }
        .info .nomi { font-weight: 600; font-size: 14px; color: #0C2340; }
        .info .tafsilot {
            font-size: 12px; color: #7C8B9E; margin-top: 2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .tahrirlash-tugma {
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px;
            background: #F0F8FF;
            color: #185FA5;
            flex-shrink: 0;
        }
        .bosh-holat {
            text-align: center;
            color: #7C8B9E;
            font-size: 13px;
            padding: 40px 0;
        }
    </style>
</head>
<body>
    <div class="qobiq">
        <div class="sarlavha-panel">
            <a href="{% url 'sozlamalar_bosh' %}" class="orqaga" aria-label="Orqaga">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
            <h1>Do'konlar</h1>
        </div>

        {% for dokon in dokonlar %}
        <div class="dokon-karta">
            <div class="ikonka">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 9L4 4H20L21 9" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M3 9H21V19A1 1 0 0 1 20 20H4A1 1 0 0 1 3 19V9Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9 20V14H15V20" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
            </div>
            <div class="info">
                <div class="nomi">{{ dokon.nomi }}</div>
                <div class="tafsilot">{{ dokon.manzili }}{% if dokon.telefon %} &middot; {{ dokon.telefon }}{% endif %}</div>
            </div>
            {% if dokon_tahrirlash_ruxsati %}
            <a href="{% url 'dokon_tahrirlash' dokon.pk %}" class="tahrirlash-tugma" aria-label="Tahrirlash">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 4H4A2 2 0 0 0 2 6V20A2 2 0 0 0 4 22H18A2 2 0 0 0 20 20V13" stroke-linecap="round" stroke-linejoin="round"/><path d="M18.5 2.5A2.121 2.121 0 0 1 21.5 5.5L12 15L8 16L9 12L18.5 2.5Z" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
            {% endif %}
            {% if dokon_ochirish_ruxsati %}
            <form method="post" action="{% url 'dokon_ochirish' dokon.pk %}" onsubmit="return confirm('Bu dokonni ochirishni tasdiqlaysizmi?');" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="tahrirlash-tugma" style="background:#FCEBEB;color:#A32D2D;border:none;cursor:pointer;" aria-label="Ochirish">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6H21M8 6V4A2 2 0 0 1 10 2H14A2 2 0 0 1 16 4V6M19 6V20A2 2 0 0 1 17 22H7A2 2 0 0 1 5 20V6H19Z" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
            </form>
            {% endif %}
        </div>
        {% empty %}
        <div class="bosh-holat">Do'konlar hali qo'shilmagan</div>
        {% endfor %}
    </div>
</body>
</html>
