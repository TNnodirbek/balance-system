{% load summa_filtr %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Qarzdorlar</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Manrope', 'Segoe UI', Arial, sans-serif;
            background: #FFFFFF;
            color: #0C2340;
        }
        .sahifa { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
        .sarlavha-panel { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .orqaga {
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 10px; background: #F0F8FF; color: #185FA5;
            text-decoration: none; flex-shrink: 0;
        }
        h1 { font-size: 18px; font-weight: 700; color: #0C2340; margin: 0; }
        .umumiy-karta {
            background: #185FA5;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        .umumiy-label { font-size: 12px; color: #DCE9F5; margin: 0 0 6px; }
        .umumiy-son { font-size: 28px; font-weight: 700; color: #FFFFFF; margin: 0; }
        .qarz-karta {
            background: #FFFFFF;
            border: 1px solid #E4EDF6;
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .qarz-tepa { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .qarz-dokon { font-size: 14px; font-weight: 700; color: #0C2340; }
        .qarz-raqam { font-size: 11px; color: #7C8B9E; margin-top: 2px; }
        .qarz-summa { font-size: 15px; font-weight: 700; color: #A32D2D; white-space: nowrap; }
        .qarz-pastki { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .qarz-sana { font-size: 11px; color: #94A7BD; }
        .qarz-tolash-link {
            font-size: 12px; font-weight: 600; color: #A32D2D;
            border: 1px solid #F0C4C4; border-radius: 8px;
            padding: 5px 10px; text-decoration: none;
        }
        .bosh-holat { text-align: center; color: #94A7BD; font-size: 13px; padding: 60px 0; }
    </style>
</head>
<body>
    <div class="sahifa">
        <div class="sarlavha-panel">
            <a href="javascript:history.back()" class="orqaga" aria-label="Orqaga">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
            <h1>Qarzdorlar</h1>
        </div>

        <div class="umumiy-karta">
            <p class="umumiy-label">Umumiy qarzdorlik</p>
            <p class="umumiy-son">{{ umumiy_qarz|som_format }}</p>
        </div>

        {% for b in qarzdorlar %}
        <div class="qarz-karta">
            <div class="qarz-tepa">
                <div>
                    <div class="qarz-dokon">{{ b.dokon.nomi }}</div>
                    <div class="qarz-raqam">Buyurtma #{{ b.pk }}</div>
                </div>
                <div class="qarz-summa">{{ b.qarz_summasi|som_format }}</div>
            </div>
            <div class="qarz-pastki">
                <span class="qarz-sana">{{ b.yaratilgan_vaqt|date:"d.m.Y" }}</span>
                <a href="{% url 'qarz_tolash' b.pk %}" class="qarz-tolash-link">Qarzni to'lash</a>
            </div>
        </div>
        {% empty %}
        <div class="bosh-holat">Qarzdorlik yo'q</div>
        {% endfor %}
    </div>
</body>
</html>
