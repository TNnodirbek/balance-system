{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bildirishnomalar</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Manrope', 'Segoe UI', Arial, sans-serif;
            background: #FFFFFF;
            color: #0C2340;
        }
        .qobiq { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
        .sarlavha-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .sarlavha-panel .chap {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .orqaga {
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 10px;
            background: #F0F8FF;
            color: #185FA5;
            text-decoration: none;
            flex-shrink: 0;
        }
        .sarlavha-panel h1 {
            font-size: 18px;
            font-weight: 700;
            color: #0C2340;
            margin: 0;
        }
        .tepa-tugmalar {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sozlama-havola {
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 10px;
            background: #F0F8FF;
            color: #185FA5;
            text-decoration: none;
            flex-shrink: 0;
        }
        .menyu-qobiq {
            position: relative;
        }
        .menyu-tugma {
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 10px;
            background: #F0F8FF;
            color: #185FA5;
            border: none;
            cursor: pointer;
        }
        .menyu-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 44px;
            min-width: 210px;
            background: #FFFFFF;
            border: 1px solid #E4EDF6;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(12, 35, 64, 0.10);
            overflow: hidden;
            z-index: 50;
        }
        .menyu-dropdown.ochiq {
            display: block;
        }
        .menyu-dropdown form {
            margin: 0;
        }
        .menyu-band {
            display: block;
            width: 100%;
            text-align: left;
            padding: 13px 16px;
            border: none;
            background: none;
            font-family: 'Manrope', 'Segoe UI', Arial, sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: #0C2340;
            cursor: pointer;
        }
        .menyu-band:hover {
            background: #F7F9FB;
        }
        .menyu-band-xavfli {
            color: #A32D2D;
        }
        .bildirishnoma-qatori {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .bildirishnoma-checkbox {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            accent-color: #A32D2D;
            display: none;
        }
        .qobiq.belgilash-faol .bildirishnoma-checkbox {
            display: block;
        }
        .bildirishnoma-karta {
            display: flex;
            gap: 12px;
            flex: 1;
            background: #FFFFFF;
            border: 1px solid #E4EDF6;
            border-radius: 14px;
            padding: 14px 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            text-decoration: none;
            color: #0C2340;
        }
        .bildirishnoma-karta.oqilmagan {
            background: #2E7D32;
            border-color: #2E7D32;
        }
        .bildirishnoma-karta.oqilmagan .matn {
            color: #FFFFFF;
        }
        .bildirishnoma-karta.oqilmagan .vaqt {
            color: rgba(255, 255, 255, 0.8);
        }
        .turi-ikonka {
            width: 36px; height: 36px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .turi-yangi_buyurtma { background: #FFF4E5; color: #B8860B; }
        .turi-qarz { background: #FCEBEB; color: #A32D2D; }
        .turi-buyurtma_olindi { background: #E8F1FB; color: #185FA5; }
        .turi-yetkazildi { background: #E8F5E9; color: #2E7D32; }
        .turi-boshqa { background: #F0F8FF; color: #185FA5; }
        .matn { font-size: 13px; font-weight: 500; flex: 1; }
        .vaqt { font-size: 11px; color: #7C8B9E; margin-top: 4px; }
        .bosh-holat {
            text-align: center;
            color: #7C8B9E;
            font-size: 13px;
            padding: 60px 0;
        }
        .tanlanganlar-panel {
            display: none;
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 100;
            max-width: 480px;
            margin: 0 auto;
            background: #FFFFFF;
            border-top: 1px solid #E4EDF6;
            box-shadow: 0 -4px 16px rgba(12, 35, 64, 0.10);
            padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
        }
        .tanlanganlar-tugma {
            width: 100%;
            height: 44px;
            border: 1px solid #F0C4C4;
            border-radius: 10px;
            background: #FCEBEB;
            color: #A32D2D;
            font-family: 'Manrope', 'Segoe UI', Arial, sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="qobiq" id="qobiq">
        <div class="sarlavha-panel">
            <div class="chap">
                <a href="javascript:history.back()" class="orqaga" aria-label="Orqaga">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </a>
                <h1>Bildirishnomalar</h1>
            </div>
            <div class="tepa-tugmalar">
                <a href="{% url 'bildirishnoma_sozlamasi' %}" class="sozlama-havola" aria-label="Sozlama">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.7" stroke-dasharray="1.6 2.7" stroke-linecap="round"/></svg>
                </a>
                {% if bildirishnomalar %}
                <div class="menyu-qobiq">
                    <button type="button" class="menyu-tugma" id="menyu-tugma" aria-label="Menyu">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
                    </button>
                    <div class="menyu-dropdown" id="menyu-dropdown">
                        <button type="button" class="menyu-band" id="belgilash-tugma">Belgilash</button>
                        <form method="post" action="{% url 'bildirishnomalar_tozalash' %}" onsubmit="return confirm('Barcha bildirishnomalarni ochirishni tasdiqlaysizmi?');">
                            {% csrf_token %}
                            <button type="submit" class="menyu-band menyu-band-xavfli">Barchasini tozalash</button>
                        </form>
                    </div>
                </div>
                {% endif %}
            </div>
        </div>

        {% for b in bildirishnomalar %}
        <div class="bildirishnoma-qatori">
            <input type="checkbox" class="bildirishnoma-checkbox" value="{{ b.pk }}" aria-label="Tanlash">
            <a href="{{ b.havola|default:'#' }}" class="bildirishnoma-karta{% if not b.oqilgan %} oqilmagan{% endif %}">
                <div class="turi-ikonka turi-{{ b.turi }}">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M18 8A6 6 0 0 0 6 8C6 15 3 17 3 17H21S18 15 18 8Z" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
                <div>
                    <div class="matn">{{ b.matn }}</div>
                    <div class="vaqt">{{ b.yaratilgan_vaqt|date:"d.m.Y H:i" }}</div>
                </div>
            </a>
        </div>
        {% empty %}
        <div class="bosh-holat">Bildirishnomalar yo'q</div>
        {% endfor %}
    </div>

    <div class="tanlanganlar-panel" id="tanlanganlar-panel">
        <form method="post" action="{% url 'bildirishnoma_ochirish' %}" id="tanlanganlar-forma">
            {% csrf_token %}
            <div id="tanlanganlar-inputlar"></div>
            <button type="submit" class="tanlanganlar-tugma">Tanlanganlarni o'chirish (<span id="tanlangan-soni">0</span>)</button>
        </form>
    </div>

    <script>
        var qobiq = document.getElementById('qobiq');
        var menyuTugma = document.getElementById('menyu-tugma');
        var menyuDropdown = document.getElementById('menyu-dropdown');
        var belgilashTugma = document.getElementById('belgilash-tugma');
        var tanlanganlarPanel = document.getElementById('tanlanganlar-panel');
        var tanlanganlarForma = document.getElementById('tanlanganlar-forma');

        if (menyuTugma) {
            menyuTugma.addEventListener('click', function (e) {
                e.stopPropagation();
                menyuDropdown.classList.toggle('ochiq');
            });
            document.addEventListener('click', function () {
                menyuDropdown.classList.remove('ochiq');
            });
        }

        function bildirishnomaTanlovYangilash() {
            var tanlanganlar = document.querySelectorAll('.bildirishnoma-checkbox:checked');
            document.getElementById('tanlangan-soni').textContent = tanlanganlar.length;
            tanlanganlarPanel.style.display = tanlanganlar.length > 0 ? 'block' : 'none';
        }

        document.querySelectorAll('.bildirishnoma-checkbox').forEach(function (cb) {
            cb.addEventListener('change', bildirishnomaTanlovYangilash);
        });

        if (belgilashTugma) {
            belgilashTugma.addEventListener('click', function () {
                menyuDropdown.classList.remove('ochiq');
                qobiq.classList.toggle('belgilash-faol');
                if (!qobiq.classList.contains('belgilash-faol')) {
                    document.querySelectorAll('.bildirishnoma-checkbox').forEach(function (cb) {
                        cb.checked = false;
                    });
                    bildirishnomaTanlovYangilash();
                }
            });
        }

        if (tanlanganlarForma) {
            tanlanganlarForma.addEventListener('submit', function () {
                var inputlarQobiq = document.getElementById('tanlanganlar-inputlar');
                inputlarQobiq.innerHTML = '';
                document.querySelectorAll('.bildirishnoma-checkbox:checked').forEach(function (cb) {
                    var input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = 'bildirishnoma_idlar';
                    input.value = cb.value;
                    inputlarQobiq.appendChild(input);
                });
            });
        }
    </script>
    <script src="{% static 'js/forma-himoya.js' %}"></script>
</body>
</html>
